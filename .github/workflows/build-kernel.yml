name: Build GKI Kernel Android 14 6.1 LTS

on:
  workflow_dispatch:
    inputs:
      OPT_KSU:
        description: "Build with KernelSU"
        type: choice
        default: "susfs4ksu"
        options:
          - "false"
          - "true"
          - "susfs4ksu"

permissions:
  contents: write

jobs:
  build:
    name: Build GKI Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache bc bison flex libssl-dev libelf-dev \
            dwarves cpio git python3 pahole libdw-dev xz-utils curl tar gzip zip

      - name: Setup CCache Environment
        run: |
          mkdir -p ~/.cache/ccache
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,file_macro" >> $GITHUB_ENV
          echo "CCACHE_NOHASHDIR=1" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=8G" >> $GITHUB_ENV

      - name: Cache CCache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Resolve Clang Version
        id: clang-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          CLANG_TAG=$(gh release list --limit 10 | awk '{print $1}' | grep -E '^clang-r' | head -n 1)

          if [ -z "$CLANG_TAG" ]; then
            CLANG_TAG="clang-r547379"
          fi

          echo "tag=$CLANG_TAG" >> $GITHUB_OUTPUT
          echo "CLANG_VERSION=$CLANG_TAG" >> $GITHUB_ENV

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v6
        with:
          path: ${{ steps.clang-info.outputs.tag }}
          key: ${{ runner.os }}-clang-${{ steps.clang-info.outputs.tag }}

      - name: Download & Extract Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CLANG_TAG: ${{ steps.clang-info.outputs.tag }}
        run: |
          mkdir -p "$CLANG_TAG"

          if gh release view "$CLANG_TAG" >/dev/null 2>&1; then
            echo "Downloading $CLANG_TAG directly from GitHub Releases..."
            gh release download "$CLANG_TAG" -p "${CLANG_TAG}.tar.gz"
          else
            echo "Warning: Release $CLANG_TAG not found in repository."
            echo "Downloading from Google Git as fallback..."
            curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_TAG}.tar.gz" -o "${CLANG_TAG}.tar.gz"
          fi

          tar -xzf "${CLANG_TAG}.tar.gz" -C "$CLANG_TAG"
          rm -f "${CLANG_TAG}.tar.gz"

      - name: Git Clone Kernel GKI (android14-6.1-lts)
        run: |
          mkdir -p android-kernel
          git clone https://android.googlesource.com/kernel/common -b android14-6.1-lts --depth=10 android-kernel/common

      - name: Integrate KernelSU
        if: ${{ github.event.inputs.OPT_KSU != 'false' }}
        working-directory: android-kernel/common
        run: curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Integrate SUSFS4KSU
        if: ${{ github.event.inputs.OPT_KSU == 'susfs4ksu' }}
        working-directory: android-kernel
        run: |
          set -e
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 --depth=10 susfs4ksu
          cd common
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_*.patch .
          
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          
          cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
          patch -p1 < 50_add_susfs_*.patch || echo "⚠️ Warning: SUSFS patch conflicts."

      - name: Set Custom Configs
        working-directory: android-kernel/common
        run: |
          {
            if [ "${{ github.event.inputs.OPT_KSU }}" != "false" ]; then
              echo "CONFIG_KSU=y"
            fi
            if [ "${{ github.event.inputs.OPT_KSU }}" = "susfs4ksu" ]; then
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=n"
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            fi
          } >> arch/arm64/configs/gki_defconfig

      - name: Build Kernel
        working-directory: android-kernel/common
        run: |
          rm -f android/abi_gki_protected_exports_aarch64
          rm -f android/abi_gki_protected_exports_x86_64
          
          export KBUILD_BUILD_USER="Yervant"
          export KBUILD_BUILD_HOST="Ubuntu"
          export KBUILD_BUILD_TIMESTAMP="1970-01-01 00:00:00 UTC"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PATH="$GITHUB_WORKSPACE/${{ env.CLANG_VERSION }}/bin:$PATH"

          # Reset zero-counters to display the actual hit rate of this job
          ccache -z

          touch .scmversion
          make O=out ARCH=arm64 LLVM=1 CC="ccache clang" gki_defconfig
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" KCFLAGS="-Wno-error" Image
          
          echo "=== CCache Statistics ==="
          ccache -s

      - name: Package Kernel Artifacts
        run: |
          set -e
          BUILD_DATE=$(date +'%Y%m%d_%H%M%S')
          TAG="GKI-6.1-${BUILD_DATE}"
          ZIP_NAME="AnyKernel3-a14-6.1-${BUILD_DATE}.zip"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          cp android-kernel/common/out/arch/arm64/boot/Image AnyKernel3-a14-6.1/
          cd AnyKernel3-a14-6.1
          zip -r9 "../$ZIP_NAME" * -x "*.git*"

      - name: Generate Changelog & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "## 🚀 Build Details"
            echo "- **GKI Base:** Android 14 6.1 LTS"
            echo "- **KernelSU Mode:** \`${{ github.event.inputs.OPT_KSU }}\`"
            echo "- **Clang Version:** \`${{ env.CLANG_VERSION }}\`"
            echo ""
            
            echo "### 🐧 Kernel GKI (common) - Last 5 Commits"
            git -C android-kernel/common log -n 5 --pretty=format:"- [%h](https://android.googlesource.com/kernel/common/+/%H) %s *(%as)*"
            echo -e "\n"

            if [ "${{ github.event.inputs.OPT_KSU }}" != "false" ] && [ -d "android-kernel/common/KernelSU/.git" ]; then
              echo "### 🛡️ KernelSU - Last 5 Commits"
              git -C android-kernel/common/KernelSU log -n 5 --pretty=format:"- [%h](https://github.com/tiann/KernelSU/commit/%H) %s *(%as)*"
              echo -e "\n"
            fi

            if [ "${{ github.event.inputs.OPT_KSU }}" = "susfs4ksu" ] && [ -d "android-kernel/susfs4ksu/.git" ]; then
              echo "### 🎭 SUSFS4KSU - Last 5 Commits"
              git -C android-kernel/susfs4ksu log -n 5 --pretty=format:"- [%h](https://gitlab.com/simonpunk/susfs4ksu/-/commit/%H) %s *(%as)*"
              echo -e "\n"
            fi
          } > changelog.md

          gh release create "${{ env.RELEASE_TAG }}" \
            "${{ env.ZIP_NAME }}" \
            android-kernel/common/out/arch/arm64/boot/Image \
            --title "GKI Kernel 6.1 (${{ env.RELEASE_TAG }})" \
            --notes-file changelog.md
            
